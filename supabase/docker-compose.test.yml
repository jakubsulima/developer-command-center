services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: command_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d command_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    volumes:
      - ./tests:/tests:ro
      - ./migrations:/migrations:ro
