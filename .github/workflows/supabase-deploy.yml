name: Wdrożenie migracji Supabase

on:
  workflow_dispatch:
    inputs:
      target:
        description: Środowisko Supabase skonfigurowane w GitHub Environments
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: supabase-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migracje ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v6

      - name: Skonfiguruj pnpm
        uses: pnpm/action-setup@v6

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Zainstaluj przypiętą wersję Supabase CLI
        run: pnpm install --frozen-lockfile

      - name: Połącz repozytorium z projektem
        run: pnpm --filter @command/web exec supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --workdir ../..

      - name: Pokaż historię migracji przed wdrożeniem
        run: pnpm --filter @command/web exec supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --workdir ../..

      - name: Zaplanuj migracje bez zapisu
        run: pnpm --filter @command/web exec supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run --workdir ../..

      - name: Zastosuj migracje
        run: pnpm --filter @command/web exec supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --workdir ../..

      - name: Sprawdź funkcje bazy
        run: pnpm --filter @command/web exec supabase db lint --linked --level warning --fail-on error --workdir ../..

      - name: Potwierdź historię migracji
        run: pnpm --filter @command/web exec supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" --workdir ../..
