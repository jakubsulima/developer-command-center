name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, testy i build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skonfiguruj pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testy z progami coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          # CI sprawdza statyczny frontend bez dostępu do danych. Build wdrażany
          # użytkownikom musi otrzymać VITE_DATA_BACKEND=supabase i publiczną konfigurację.
          VITE_DATA_BACKEND: demo

      - name: Kontrola budżetu bundle
        run: pnpm check:bundle

      - name: Raport wydajności i audyt UI
        run: |
          pnpm performance:audit-ui
          pnpm performance:report -- --baseline docs/performance/plan-06-baseline.json

  dependency-audit:
    name: Audyt zależności
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skonfiguruj pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Zablokuj podatności wysokie i krytyczne
        run: pnpm audit --audit-level high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zainicjalizuj CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Przeanalizuj kod
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
